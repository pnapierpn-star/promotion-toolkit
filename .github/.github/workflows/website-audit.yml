name: Website SEO Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check website SEO
        run: |
          python3 - <<'PY'
          import urllib.request
          from html.parser import HTMLParser

          base = 'https://www.paulnapierskie.com'
          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = False
                  self.titles = []
                  self.descriptions = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'title': self.title = True
                  if tag == 'meta' and attrs.get('name', '').lower() == 'description':
                      self.descriptions.append(attrs.get('content', ''))
              def handle_endtag(self, tag):
                  if tag == 'title': self.title = False
              def handle_data(self, data):
                  if self.title: self.titles.append(data)

          for path in ['/', '/robots.txt', '/sitemap.xml']:
              url = base + path
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(
                          url, headers={'User-Agent': 'WebsiteAudit/1.0'}
                      ), timeout=20
                  ) as response:
                      content = response.read().decode(
                          'utf-8', errors='replace'
                      )
                      print(f'{url}: HTTP {response.status}')
                      if path == '/':
                          parser = PageParser()
                          parser.feed(content)
                          print('Title:', ''.join(parser.titles).strip() or 'MISSING')
                          print('Meta description:', parser.descriptions[0] if parser.descriptions else 'MISSING')
              except Exception as error:
                  print(f'{url}: ERROR {error}')
          PY
